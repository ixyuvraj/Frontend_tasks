<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-gray-700 flex justify-center items-center min-h-screen">
    <div class="bg-gray-500 rounded-lg p-8 shadow-lg max-w-sm w-full shadow-3xl">
        <h2 class="text-center text-3xl text-white margin font-bold p-3">Login</h2>
        <form action="">
            <div class="mb-4 ">
                <label class="block text-sm text-gray-50 font-medium p-2" for="">Email</label>
                <input class="bg-amber-50 w-full px-3 py-2 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500"  type="email" name="" id="" placeholder="Email" />
            </div>

            <div class="mb-4">
                <label class="block text-sm text-gray-50 font-medium p-2" for="">Password</label>
                <input class="bg-amber-50 w-full px-3 py-2 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500" type="password" placeholder="password" />
            </div>

            <button class="w-full bg-blue-300 text-blue-950 text-shadow-amber-100  my-5 py-3 rounded-md hover:bg-blue-600 shadow-2xl" type="submit">Login</button>
        </form>
    </div>
</body>
</html>
